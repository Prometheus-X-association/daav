services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    restart: always
    networks:
      - daav
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: daav_datasets
    command: mongod --auth

  # MongoDB Administration Interface (optional)
  mongo-express:
    image: mongo-express:1.0.2
    restart: always
    ports:
      - "8083:8081"
    networks:
      - daav
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    profiles:
      - admin

  # Elasticsearch test node (optional): docker-compose --profile elastic up -d
  # Set ELASTIC_PASSWORD (e.g. in a .env file next to this file) and add
  # ALLOWED_PRIVATE_HOSTS=elasticsearch to backendApi/.env so that DAAV can reach it.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    restart: always
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - daav
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    profiles:
      - elastic

  # FastAPI Backend with Uvicorn
  backend:
    build: 
      context: ./backendApi
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8000"
    networks:
      - daav
    # Optional local settings (SMTP, ...). Values below in "environment" take precedence.
    env_file:
      - path: ./backendApi/.env
        required: false
    environment:
      # MongoDB Configuration
      MONGODB_URL: mongodb://admin:admin123@mongodb:27017/daav_datasets?authSource=admin
      DATABASE_NAME: daav_datasets
      WORKERS: 4
      
      # Server Configuration
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      ENVIRONMENT: production
      
      # CORS for frontend
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"

      # Secrets — no default value. Set them here or in backendApi/.env.
      # If they are not set, temporary keys are generated on first start in the backend-secrets
      # volume (/app/secrets/*_TMP) and an error is logged until they are copied here.
      # JWT_SECRET_KEY: ""        # min. 32 characters
      # FIELD_ENCRYPTION_KEY: ""  # Fernet key encrypting the dataset credentials
      SECRETS_DIR: /app/secrets

      MAX_FILE_SIZE: 100MB
      UPLOAD_DIR: /app/uploads
      
      # Logging
      LOG_LEVEL: INFO
      LOG_FILE: /app/logs/app.log
      
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
      - backend-secrets:/app/secrets
    depends_on:
      - mongodb
    healthcheck:
      # curl is not installed in the python slim image
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Angular Frontend
  frontend:
    build:
      context: ./frontendApp
      dockerfile: Dockerfile
      target: prod
    restart: always
    ports:
      - "8080:80"
    networks:
      - daav
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
      CORS_ORIGIN: "http://localhost:8080"

networks:
  daav:
    driver: bridge

volumes:
  mongodb-data:
  mongodb-config:
  backend-uploads:
  backend-logs:
  backend-secrets:
  elasticsearch-data: