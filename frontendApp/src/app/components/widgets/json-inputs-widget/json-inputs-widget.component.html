<ion-button (click)="openModal()" (pointerdown)="$event.stopPropagation()" (dblclick)="$event.stopPropagation()"
  expand="block">Inputs json example</ion-button>
<ion-modal [isOpen]="isModalOpen" (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>
          Manage inputs
        </ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding" scroll-y="true">
      <cdk-accordion class="example-accordion">
        @for (item of data.inputsDataExample; track $index) {
          <cdk-accordion-item #accordionItem="cdkAccordionItem" class="example-accordion-item">
            <ion-item slot="header" (click)="accordionItem.toggle()">
              <ion-label>Input Example #{{$index + 1}}</ion-label>
              <ion-button slot="end" fill="clear" color="danger" [attr.aria-label]="'Delete input example ' + ($index + 1)" (click)="removeInputExample($index); $event.stopPropagation()">
                <ion-icon slot="icon-only" name="trash-outline" aria-hidden="true"></ion-icon>
              </ion-button>
              <!-- the label carries the state because ion-button does not forward aria-expanded updates -->
              <ion-button slot="end" fill="clear"
                [attr.aria-label]="(accordionItem.expanded ? 'Collapse' : 'Expand') + ' input example ' + ($index + 1)"
                (click)="accordionItem.toggle(); $event.stopPropagation()">
                <ion-icon slot="icon-only" [name]="accordionItem.expanded ? 'chevron-up-outline' : 'chevron-down-outline'" aria-hidden="true"></ion-icon>
              </ion-button>
            </ion-item>
            @if(accordionItem.expanded) {
              <div  class="ion-padding">
                <json-editor [options]="makeOptions()" [(ngModel)]="data.inputsDataExample[$index]" (change)="this.hasChanged=true"></json-editor>
              </div>
            }
          </cdk-accordion-item>
        }
      </cdk-accordion>

      <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button aria-label="Add input example" (click)="addInputExample()">
          <ion-icon name="add" aria-hidden="true"></ion-icon>
        </ion-fab-button>
      </ion-fab>
    </ion-content>
  </ng-template>
</ion-modal>
