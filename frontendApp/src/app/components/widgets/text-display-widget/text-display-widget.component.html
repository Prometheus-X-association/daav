<div class="text-display-widget">
  @if (data.label) {
    <span class="text-display-label">
      {{ data.label }}
    </span>
  }

  <div class="text-display-content" >
    <span class="text-value" [title]="data.value">
      {{ data.value }}
    </span>
    @if (data.copyable) {
      <ion-button (pointerdown)="$event.stopPropagation()" (dblclick)="$event.stopPropagation()" class="copy-button" size="small" [attr.aria-label]="'Copy ' + (data.label || 'value')" (click)="onCopy(data.value,$event)"><ion-icon slot="icon-only" name="copy-outline" aria-hidden="true"
      ></ion-icon>
    </ion-button>
  }
</div>
</div>
