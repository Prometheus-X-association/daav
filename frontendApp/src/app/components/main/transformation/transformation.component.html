<div slot="content">
  <ion-list>
    @for(workflow of workflowService.workflows();track workflow.id){
    <ion-item class="dataset-container">
      <ion-button expand="full" fill="clear" (click)="loadSelectedWorkflow(workflow);changeView();"
        class="dataset-name">
        <div class="datasets-infos-container">
          <div class="dataset-info-container"><span class="dataset-info-title">Name: </span><span
              class="dataset-info">{{workflow.name}}</span></div>
          <div class="dataset-info-container">
            <span class="dataset-info-title">Id: </span>
            <span class="dataset-info">{{workflow.id}}</span>
          </div>
        </div>
      </ion-button>
      <!-- kept outside the workflow button: a button cannot contain another interactive element -->
      <ion-button class="iconPaste" size="small" [attr.aria-label]="'Copy id of workflow ' + workflow.name" (click)="copyToClipboard(workflow.id,$event)"><ion-icon slot="icon-only" name="copy-outline" aria-hidden="true"
        ></ion-icon></ion-button>
      <div class="iconsContainer">
        @if (workflowsStatus.get(workflow.id) === "running") {
        <ion-spinner name="circles" role="status" [attr.aria-label]="'Workflow ' + workflow.name + ' is running'"></ion-spinner>
        }@else if (workflowsStatus.get(workflow.id) === "error") {
        <button type="button" class="icon-button" [attr.aria-label]="'Workflow ' + workflow.name + ' failed, run it again'" (click)="executeWorkflow(workflow)">
          <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
        </button>
        }
        @else {
        <button type="button" class="icon-button" [attr.aria-label]="'Run workflow ' + workflow.name" (click)="executeWorkflow(workflow)">
          <ion-icon name="play-outline" aria-hidden="true"></ion-icon>
        </button>
        }
      </div>
      <div class="iconsContainer">
        <button type="button" class="icon-button" [attr.aria-label]="'Edit update rules of workflow ' + workflow.name" (click)="updateRules(workflow.id)">
          <ion-icon name="construct-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
      <div class="iconsContainer">
        <button type="button" class="icon-button" [attr.aria-label]="'Delete workflow ' + workflow.name" (click)="deleteWorkflow(workflow.id)">
          <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </ion-item>
    }
  </ion-list>
</div>
